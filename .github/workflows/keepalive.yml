# Keeps the free Render backend awake (it sleeps after 15 idle minutes) so visitors never land on an empty job board.
# One always-on free service uses ~730 of Render's 750 free hours a month. Also keeps the Supabase project from pausing.
# GitHub switches off scheduled workflows after 60 days without repository activity; the daily run re-enables this one
# through the API so the pings never stop quietly.
name: Keep the API awake
on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: curl -fsS --retry 4 --retry-delay 15 --max-time 60 "${API_URL:-https://willai-api-doyy.onrender.com}/api/health"
        env:
          API_URL: ${{ vars.API_URL }}
      - name: Keep this schedule switched on
        if: always() && (github.event.schedule == '17 3 * * *' || github.event_name == 'workflow_dispatch')
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
