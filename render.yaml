# Render blueprint for the backend (job collector + AI adviser). Free plan.
# In Render: New → Blueprint → pick this repo. Then set the secret values (sync: false) in the service's Environment tab.
services:
  - type: web
    name: willai-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "24"
      - key: FIREBASE_PROJECT_ID
        value: willai-564c9
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://willai-564c9.web.app,https://willai-564c9.firebaseapp.com
      - key: DATABASE_URL           # Supabase connection string (transaction pooler, port 6543)
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: JOOBLE_KEY
        sync: false
      - key: USAJOBS_KEY
        sync: false
      - key: USAJOBS_EMAIL
        sync: false
      - key: REED_KEY
        sync: false
